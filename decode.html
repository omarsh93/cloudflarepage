<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>URLデコードツール</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }

      textarea {
        width: 100%;
        height: 120px;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 5px;
      }

      #copyBtn {
        padding: 4px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      #output {
        white-space: pre-wrap;
        padding: 10px;
        border: 1px solid #ccc;
        background: #f9f9f9;
      }
    </style>
  </head>

  <body>
    <h2>URLデコードツール</h2>

    <textarea
      id="input"
      placeholder="ここにURLエンコードされた文字列を貼り付けてください"
    ></textarea>

    <div class="title">
      <h3>デコード結果</h3>
      <button id="copyBtn">コピー</button>
    </div>

    <div id="output"></div>

    <script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const copyBtn = document.getElementById("copyBtn");

      function decodeWikiUrl(str) {
        // .E3.82.AB → %E3%82%AB に変換
        str = str.replace(/\.([0-9A-Fa-f]{2})/g, "%$1");

        // + → スペース
        str = str.replace(/\+/g, " ");

        return decodeURIComponent(str);
      }

      input.addEventListener("input", () => {
        try {
          output.textContent = decodeWikiUrl(input.value);
        } catch (e) {
          output.textContent = "デコードできません（不正な形式）";
        }
      });

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(output.textContent);
          const oldText = copyBtn.textContent;
          copyBtn.textContent = "コピーしました";
          setTimeout(() => {
            copyBtn.textContent = oldText;
          }, 1500);
        } catch (e) {
          alert("コピーに失敗しました");
        }
      });
    </script>
  </body>
</html>
